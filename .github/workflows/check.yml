name: check-and-package

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      challenge_ref:
        description: "Branch, tag or commit of the challenge repo to check against"
        default: "main"
      require_docs:
        description: "Fail if WRITEUP.md or README.md is missing"
        type: boolean
        default: false

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CHALLENGE_REPO_NAME: QuantumCryptography-at-Qiskit-OSU/Quantum-Cryptography-Challenge

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Stop if this repository is public
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          visibility=$(gh api "repos/${{ github.repository }}" --jq .visibility)
          echo "visibility: $visibility"
          if [ "$visibility" != "private" ]; then
            echo "::error::The challenge rules say not to publish solutions. Make this repository private."
            exit 1
          fi

      - name: Our submission
        uses: actions/checkout@v4
        with:
          path: submission

      - name: Challenge repo (tools, helpers, hashes)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.CHALLENGE_REPO_NAME }}
          ref: ${{ inputs.challenge_ref || 'main' }}
          token: ${{ secrets.CHALLENGE_REPO_TOKEN || github.token }}
          path: challenge

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: challenge/requirements.txt

      - name: Install the challenge's pinned packages (without the notebook stack)
        run: |
          grep -v -E '^(notebook|ipykernel)==' challenge/requirements.txt > /tmp/requirements-ci.txt
          python -m pip install -r /tmp/requirements-ci.txt

      - name: Check every tier, zip, and check the zip
        working-directory: submission
        env:
          CHALLENGE_REPO: ${{ github.workspace }}/challenge
        run: |
          python ci/package.py --out "$GITHUB_WORKSPACE/Cryptographers.zip" \
            ${{ (startsWith(github.ref, 'refs/tags/') || inputs.require_docs) && '--require-docs' || '' }}

      - name: Show the checker report
        if: always()
        run: |
          if [ -f last_check_report.md ]; then
            { echo "### Checker report"; cat last_check_report.md; } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Keep the zip
        uses: actions/upload-artifact@v4
        with:
          name: Cryptographers-zip
          path: Cryptographers.zip
          retention-days: 14
          if-no-files-found: error
